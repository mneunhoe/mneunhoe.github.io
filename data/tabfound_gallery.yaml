# Labels for the tabfound architecture gallery
# (content/software/tabfound-gallery). The figures and their manifest come
# from tabfound via scripts/sync-tabfound-gallery.sh; this file holds the
# names the controls show. Keys match the manifest's model keys.

default:
  model: tabicl
  style: schematic
  detail: overview
  compare: [tabpfn3, tabicl]

models:
  tabpfn:
    name: TabPFN v2.5
    family: TabPFN
  tabpfn26:
    name: TabPFN v2.6
    family: TabPFN
  tabpfn3:
    name: TabPFN v3
    family: TabPFN
  tabpfn35:
    name: TabPFN v3.5
    family: TabPFN
  tabicl:
    name: TabICL v2
    family: TabICL
  tabfm:
    name: TabFM
    family: TabFM
  mitra:
    name: Mitra
    family: Mitra
  kumo:
    name: Kumo Tabular small
    family: Kumo Tabular
  kumo-medium:
    name: Kumo Tabular medium
    family: Kumo Tabular
  kumo-large:
    name: Kumo Tabular large
    family: Kumo Tabular

styles:
  cards:
    label: Cards
  tufte:
    label: Tufte
  glyphs:
    label: Glyphs
  schematic:
    label: Schematic

details:
  overview:
    label: Overview
  full:
    label: Full
